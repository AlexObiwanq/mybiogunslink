<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ecstasy wrld</title>
  <!-- Font modern FontAwesome pentru iconițe -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @font-face {
      font-family: 'CustomFont';
      src: url('PlaypenSans-Bold.ttf') format('truetype');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'CustomFont', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #050505;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* 1. OVERLAY DE INTRARE (Click to Enter) */
    #enter-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #enter-overlay h1 {
      font-size: 22px;
      letter-spacing: 4px;
      color: #ffffff;
      text-transform: lowercase;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* 2. FUNDAL ANIMAT / VIDEO OVERLAY */
    .bg-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(120, 0, 180, 0.15) 0%, rgba(5, 5, 5, 0.95) 100%);
      z-index: 1;
    }

    /* 3. CARDUL PRINCIPAL GUNS.LOL */
    .profile-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: rgba(18, 18, 22, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(180, 0, 255, 0.1);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .profile-card.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    /* POZA DE PROFIL */
    .avatar-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 16px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 20px rgba(216, 0, 166, 0.3);
    }

    /* NUME SI BADGE-URI */
    .username-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .username {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff 0%, #d800a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 14px;
      color: #d800a6;
      filter: drop-shadow(0 0 8px #d800a6);
    }

    .bio-text {
      font-size: 13px;
      color: #a0a0a0;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* SOCIAL LINKS (ICONITE) */
    .socials-container {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .social-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 18px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-btn:hover {
      background: rgba(216, 0, 166, 0.2);
      border-color: #d800a6;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(216, 0, 166, 0.4);
      color: #ff77e9;
    }

    /* MUSIC PLAYER GUNS.LOL STYLE */
    .music-player {
      width: 100%;
      background: rgba(10, 10, 12, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .track-cover {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 12px;
      color: #777;
    }

    .play-pause-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 5px;
      transition: color 0.2s;
    }

    .play-pause-btn:hover {
      color: #d800a6;
    }
  </style>
</head>
<body>

  <!-- Overlay-ul inițial de click (necesar pentru redarea audio) -->
  <div id="enter-overlay" onclick="enterSite()">
    <h1>[ click to enter ]</h1>
  </div>

  <div class="bg-overlay"></div>

  <!-- Cardul Stil Guns.lol -->
  <div class="profile-card" id="card">
    
    <div class="avatar-wrapper">
      <img src="loveme.jpg" class="avatar-img" alt="Avatar">
    </div>

    <div class="username-container">
      <span class="username">ecstasy wrld</span>
      <i class="fa-solid fa-circle-check badge"></i>
    </div>

    <p class="bio-text">navigating through dark soundscapes & late night vibes.</p>

    <!-- Iconițe Social Media -->
    <div class="socials-container">
      <a href="https://spotify.com" target="_blank" class="social-btn"><i class="fa-brands fa-spotify"></i></a>
      <a href="https://stats.fm/luvalexxx" target="_blank" class="social-btn"><i class="fa-solid fa-chart-simple"></i></a>
      <a href="https://discord.com" target="_blank" class="social-btn"><i class="fa-brands fa-discord"></i></a>
    </div>

    <!-- Music Player integrat -->
    <div class="music-player">
      <img src="loveme.jpg" id="player-cover" class="track-cover" alt="Cover">
      <div class="track-info">
        <div class="track-title" id="player-title">Love Me</div>
        <div class="track-artist">ecstasy wrld</div>
      </div>
      <button class="play-pause-btn" onclick="togglePlay()"><i class="fa-solid fa-pause" id="play-icon"></i></button>
    </div>

  </div>

  <audio id="bg-audio" src="loveme.mp3" loop></audio>

  <script>
    const audio = document.getElementById('bg-audio');
    const playIcon = document.getElementById('play-icon');

    function enterSite() {
      // Ascunde overlay-ul
      const overlay = document.getElementById('enter-overlay');
      overlay.style.opacity = '0';
      overlay.style.visibility = 'hidden';

      // Afișează cardul cu animație
      document.getElementById('card').classList.add('loaded');

      // Pornește muzica automat la click
      audio.play();
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playIcon.className = "fa-solid fa-pause";
      } else {
        audio.pause();
        playIcon.className = "fa-solid fa-play";
      }
    }
  </script>

</body>
</html>
