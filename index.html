<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@ibr.alexandru | bio</title>
  <meta name="description" content="heyyy">
  
  <!-- Fonturi Guns.lol & Icons -->
  <link href="https://assets.guns.lol/fonts/X6XYTKIVDUW7GZTZPZNN4EUM5KH54KHF.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Fontul Custom de pe Guns.lol */
    @font-face {
      font-family: 'CustomGunsFont';
      src: url('https://r2.guns.lol/8ba309c2-01e9-4301-8e4a-a5a901a73dc1.otf') format('opentype');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: url(https://r2.guns.lol/aa9eeb10-8134-4721-928f-d2fec7c2204f.png) 16 16, auto !important;
      font-family: 'CustomGunsFont', 'Onest', sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* 1. CLICK TO ENTER OVERLAY */
    #enter-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #enter-overlay span {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* 2. BACKGROUND VIDEO */
    .bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.5);
    }

    /* 3. CANVAS PENTRU NINSORI */
    #snow-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* 4. CARDUL PRINCIPAL GUNS.LOL */
    .profile-card {
      position: relative;
      z-index: 10;
      width: 44rem;
      max-width: 90vw;
      padding: 26px;
      background: rgba(255, 255, 255, 0);
      border: 2px solid rgba(246, 0, 0, 0.3); /* Marginea roșie */
      border-radius: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(0px);
    }

    .card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .avatar-img {
      width: 90px;
      height: 90px;
      border-radius: 35px;
      object-fit: cover;
      border: 2px solid rgba(246, 0, 0, 0.3);
    }

    .username-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .username {
      font-size: 36px;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0px 0px 16.5px #ffffff;
    }

    .badge-icon {
      color: #ffffff;
      font-size: 20px;
      filter: drop-shadow(0 0 7px #ffffff);
    }

    .bio-text {
      font-size: 17px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
    }

    /* SOCIAL LINKS (ALB CU GLOW) */
    .socials-row {
      display: flex;
      gap: 16px;
      margin-top: 10px;
    }

    .social-link {
      color: #ffffff;
      font-size: 22px;
      text-decoration: none;
      filter: drop-shadow(#ffffff 1px 0 7px);
      transition: transform 0.2s ease;
    }

    .social-link:hover {
      transform: scale(1.2);
    }

    /* CONTROL VOLUM STÂNGA SUS */
    .volume-btn {
      position: fixed;
      top: 20px; left: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <!-- Overlay-ul inițial Guns.lol -->
  <div id="enter-overlay" onclick="enterSite()">
    <span>click to enter...</span>
  </div>

  <!-- Buton Mute/Unmute -->
  <button class="volume-btn" onclick="toggleAudio()">
    <i class="fa-solid fa-volume-high" id="vol-icon"></i>
  </button>

  <!-- Videoclipul original de fundal de pe Guns.lol -->
  <video class="bg-video" autoplay loop muted playsinline id="bg-video">
    <source src="https://r2.guns.lol/aeab115e-8ce1-4666-946b-b93488768c19.mp4" type="video/mp4">
  </video>

  <!-- Canvas pentru Ninsori -->
  <canvas id="snow-canvas"></canvas>

  <!-- Cardul de profil Guns.lol -->
  <div class="profile-card">
    <div class="card-content">
      <!-- Avatarul original -->
      <img src="https://r2.guns.lol/64fc1163-2128-424a-94d6-18e432e41f6f.webp" class="avatar-img" alt="Avatar">

      <div class="username-row">
        <span class="username" id="typed-username"></span>
        <!-- Diamond Badge-ul alb -->
        <svg xmlns="http://www.w3.org/2000/svg" class="badge-icon" width="1em" height="1em" viewBox="23 32 465 448">
          <path fill="currentColor" d="M396.31 32H264l84.19 112.26L396.31 32zm-280.62 0l48.12 112.26L248 32H115.69zM256 74.67L192 160h128l-64-85.33zm166.95-23.61L376.26 160H488L422.95 51.06zm-333.9 0L23 160h112.74L89.05 51.06zM146.68 192H24l222.8 288h.53L146.68 192zm218.64 0L264.67 480h.53L488 192H365.32zm-35.93 0H182.61L256 400l73.39-208z"></path>
        </svg>
      </div>

      <div class="bio-text" id="typed-bio"></div>

      <!-- Iconițe Social Media -->
      <div class="socials-row">
        <a href="https://open.spotify.com/user/31jcaduiayq7onu4xb6orlw5uc44" target="_blank" class="social-link"><i class="fa-brands fa-spotify"></i></a>
        <a href="https://instagram.com/alexobiwanq/" target="_blank" class="social-link"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://steamcommunity.com/id/alexandruibrahimovici" target="_blank" class="social-link"><i class="fa-brands fa-steam"></i></a>
        <a href="https://tiktok.com/@alexobiwanq" target="_blank" class="social-link"><i class="fa-brands fa-tiktok"></i></a>
      </div>
    </div>
  </div>

  <!-- Piesa audio originala de pe Guns.lol -->
  <audio id="bg-audio" src="https://r2.guns.lol/35948b79-0a1a-4640-bb6f-e2a35442da00.mp3" loop></audio>

  <script>
    const audio = document.getElementById('bg-audio');
    const volIcon = document.getElementById('vol-icon');

    function enterSite() {
      const overlay = document.getElementById('enter-overlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 800);

      audio.play();
      startTypewriterName();
    }

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        volIcon.className = "fa-solid fa-volume-high";
      } else {
        audio.pause();
        volIcon.className = "fa-solid fa-volume-xmark";
      }
    }

    /* EFECTE TYPEWRITER PENTRU NUME SI BIO */
    const nameText = "alexandru";
    const bioText = "heyyy";
    let n = 0, b = 0;

    function startTypewriterName() {
      if (n < nameText.length) {
        document.getElementById("typed-username").innerHTML += nameText.charAt(n);
        n++;
        setTimeout(startTypewriterName, 150);
      } else {
        setTimeout(startTypewriterBio, 300);
      }
    }

    function startTypewriterBio() {
      if (b < bioText.length) {
        document.getElementById("typed-bio").innerHTML += bioText.charAt(b);
        b++;
        setTimeout(startTypewriterBio, 100);
      }
    }

    /* ANIMAȚIE SNOWFLAKES */
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const flakes = Array.from({ length: 45 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2.5 + 1,
      speed: Math.random() * 1 + 0.5,
      opacity: Math.random() * 0.8 + 0.2
    }));

    function drawSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";

      flakes.forEach(flake => {
        ctx.beginPath();
        ctx.globalAlpha = flake.opacity;
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        ctx.fill();

        flake.y += flake.speed;
        if (flake.y > canvas.height) {
          flake.y = -5;
          flake.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(drawSnow);
    }
    drawSnow();
  </script>

</body>
</html>
